name: Xeo Android CI

on:
  push:
    branches: [ "main", "master", "dev" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 26.1.10909125
  JAVA_VERSION: '17'
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  XEO_KEYSTORE_BASE64: ${{ secrets.XEO_KEYSTORE_BASE64 }}

jobs:
  build:
    name: Build APK (release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Restore the pinned Xenia source tree (including initialized submodules)
      # so normal app-only changes do not download the large native dependency tree again.
      - name: Cache Xenia source tree
        uses: actions/cache@v4
        with:
          path: xenia-upstream
          key: xenia-8f55b4abf70d5041e2e9da65f8b2adcce002b115-${{ hashFiles('patches/**', 'setup.sh') }}

      - name: Clone or restore xenia-upstream
        run: |
          set -euo pipefail
          if [ ! -d xenia-upstream/.git ]; then
            git init xenia-upstream
            git -C xenia-upstream remote add origin https://github.com/xenia-canary/xenia-canary.git
          fi
          git -C xenia-upstream fetch --depth 1 origin 8f55b4abf70d5041e2e9da65f8b2adcce002b115
          git -C xenia-upstream checkout --force FETCH_HEAD
          git -C xenia-upstream submodule update --init --recursive --depth 1
          echo "xenia-upstream: $(git -C xenia-upstream rev-parse HEAD)"

      - name: Install shader compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools

      - name: Symlink src/ and third_party/
        run: bash setup.sh

      - name: Compile SPIR-V Shaders
        run: |
          export VULKAN_SDK=/usr
          python3 xenia-upstream/xenia-build.py buildshaders --target spirv

      - name: Verify source tree
        run: |
          ls src/xenia/
          ls third_party/ | head -10

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Install NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager não encontrado em $ANDROID_SDK_ROOT"
            find "$ANDROID_SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          PACKAGES=()
          [ -d "$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" ] || PACKAGES+=("ndk;${{ env.NDK_VERSION }}")
          [ -d "$ANDROID_SDK_ROOT/cmake/3.22.1" ] || PACKAGES+=("cmake;3.22.1")
          if [ "${#PACKAGES[@]}" -gt 0 ]; then
            "$SDKMANAGER" "${PACKAGES[@]}" --sdk_root="$ANDROID_SDK_ROOT" --channel=0
          else
            echo "NDK and CMake already installed; skipping SDK package installation."
          fi
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Verify Gradle wrapper
        run: |
          test -f gradlew                          || { echo "ERROR: gradlew missing";            exit 1; }
          test -f gradle/wrapper/gradle-wrapper.jar || { echo "ERROR: gradle-wrapper.jar missing"; exit 1; }
          chmod +x gradlew

      - name: Cache NDK build
        uses: actions/cache@v4
        with:
          path: app/.cxx
          key: ndk-${{ runner.os }}-26.1.10909125-release-${{ hashFiles('app/src/main/cpp/**', 'patches/**', 'setup.sh') }}
          restore-keys: ndk-${{ runner.os }}-release-

      # Configure the persistent signing key when repository Actions secrets exist.
      # Required secrets: XEO_KEYSTORE_BASE64, XEO_KEYSTORE_PASSWORD,
      # XEO_KEY_ALIAS, and XEO_KEY_PASSWORD.
      - name: Configure release signing key
        if: ${{ env.XEO_KEYSTORE_BASE64 != '' }}
        env:
          XEO_KEYSTORE_BASE64: ${{ secrets.XEO_KEYSTORE_BASE64 }}
          XEO_KEYSTORE_PASSWORD: ${{ secrets.XEO_KEYSTORE_PASSWORD }}
          XEO_KEY_ALIAS: ${{ secrets.XEO_KEY_ALIAS }}
          XEO_KEY_PASSWORD: ${{ secrets.XEO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/xeo-release.jks"
          printf '%s' "$XEO_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          {
            echo "XEO_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "XEO_KEYSTORE_PASSWORD=$XEO_KEYSTORE_PASSWORD"
            echo "XEO_KEY_ALIAS=$XEO_KEY_ALIAS"
            echo "XEO_KEY_PASSWORD=$XEO_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xeo-release-${{ github.sha }}
          path: app/build/outputs/apk/release/
          if-no-files-found: error
          retention-days: 14

      - name: Upload release symbols
        uses: actions/upload-artifact@v4
        with:
          name: xeo-symbols-${{ github.sha }}
          path: app/build/intermediates/merged_native_libs/release/
          retention-days: 14
        continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Stub src/ and third_party/ for lint
        run: mkdir -p src/xenia third_party

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Run lint
        run: |
          chmod +x gradlew
          ./gradlew lintDebug --no-daemon --stacktrace

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: warn
